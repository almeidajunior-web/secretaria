name: CI

# Every pull request (and every push to main) has to pass lint, the unit
# tests, a production build and the end-to-end suite before it's merged.
# Publishing is Netlify's job: it deploys main to production and gives each
# pull request its own preview.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Keep the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
